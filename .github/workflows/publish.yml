name: Publish to npm

# 通过 npm Trusted Publishing（OIDC）发布，全程不需要任何长期 token，也不需要 OTP。
#
# 触发方式（tag 形如 vX.Y.Z，且必须与 package.json 的 version 一致）
#   1) 推送版本 tag —— 首选：git push origin v0.5.0 即发布。
#   2) GitHub Release 被发布 —— release 事件的 workflow 定义取自默认分支，
#      所以本文件合进 main 之后，给历史 tag（例如 v0.4.10）补建 Release 也能发。
#      ⚠️ 这个事件的投递不稳：2026-09-24 给 v0.4.10 补建 Release 时它**没有触发**
#         （Actions 里 event=release 的运行数为 0，最后靠第 3 条手动 dispatch 才发出去），
#         而同一天给 v0.5.0 建 Release 时它又正常触发了。所以补发历史 tag 请优先走第 3 条，
#         别因为「绿了」就以为发出去了 —— 要看日志里有没有 `+ dsh-voice-scribe@X.Y.Z`。
#   3) 手动：gh workflow run publish.yml --ref main -f publish_ref=refs/tags/v0.4.10
#
# 首次使用前要在 npmjs.com 配一次 Trusted Publisher（只能人工操作）：
#   https://www.npmjs.com/package/dsh-voice-scribe/access
#     Provider:              GitHub Actions
#     Organization or user:  PensiveFei
#     Repository:            dsh-voice-scribe
#     Workflow filename:     publish.yml      <- 必须与本文件名逐字一致
#     Environment:           留空
#
# 排查
#   - 404 / npm-trusted-publisher-not-configured -> npm 端的仓库名或 workflow 文件名对不上
#   - OIDC token not found                       -> 少了 id-token: write
#   - npm 版本低于 11.5.1                         -> Trusted Publishing 不可用
#
# ⚠️ 首次"真实"运行才是 Trusted Publisher 配置的验证：npm 的 OIDC 交换失败会被 CLI
#    静默吞掉（lib/utils/oidc.js 设计上不抛错），所以 --dry-run 全绿并不代表 TP 配好了。
#    真正的校验发生在 npm publish 写 registry 的那一刻；未配置时报 404 / E404。
#
# 发布 ref 必须是 tag：workflow_dispatch 不给 publish_ref 时用的是本次运行的 ref
# （通常是 main），而 main 通常领先于最近 tag，那样发出去的字节不属于任何 tag ——
# 这种情况现在会被直接拒绝，必须显式传 publish_ref=refs/tags/vX.Y.Z。
#
# 安全说明：本文件不引用任何 secret。若将来要加 secret，先想清楚谁有权改这个 workflow
# —— 能改它的人就能让 CI 拿到仓库里的全部 secrets。

on:
  # 首选路径：推版本 tag 即发布。push 事件由人（或 PAT）触发，投递可靠，
  # 且 tag 本身就是「要发什么字节」的唯一事实来源。
  push:
    tags: ['v*']
  # 补发历史 tag 时的备用路径。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: '要发布的 ref（留空 = 用本次运行的 ref）。历史 tag 走这里，例如 refs/tags/v0.4.10'
        required: false
        default: ''
      dry_run:
        description: '只演练不发布（true = npm publish --dry-run）'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: gate and publish (Trusted Publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.publish_ref || github.ref }}

      # registry-url 是必需的：让 npm publish 解析到公共 registry，也让 npm 的 OIDC
      # 客户端知道去哪个 registry 换发布用的短期凭据。这里不设 NODE_AUTH_TOKEN。
      - name: Set up Node (npm >= 11.5.1 required for Trusted Publishing)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check toolchain
        run: |
          node --version
          NPMV=$(npm --version)
          echo "npm $NPMV"
          MAJOR=${NPMV%%.*}
          MINOR=${NPMV#*.}
          MINOR=${MINOR%%.*}
          if [ "$MAJOR" -lt 11 ] || { [ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]; }; then
            echo "::error::npm $NPMV is below 11.5.1 -- Trusted Publishing needs 11.5.1+"
            exit 1
          fi

      - name: Guard package.json version against the ref
        env:
          PUBLISH_REF: ${{ inputs.publish_ref }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          case "$PUBLISH_REF" in
            refs/tags/*) REF="${PUBLISH_REF#refs/tags/}" ;;
            "")          REF="${GITHUB_REF_NAME}" ;;
            *)           REF="${PUBLISH_REF##*/}" ;;
          esac
          echo "package.json=$PKG  ref=$REF"
          case "$REF" in
            v*)
              TAG="${REF#v}"
              if [ "$PKG" != "$TAG" ]; then
                echo "::error::package.json version ($PKG) does not match tag ($REF)"
                exit 1
              fi
              echo "OK: version and tag agree"
              ;;
            *)
              # A branch ref publishes whatever that branch happens to contain
              # under its own package.json version — main is normally AHEAD of
              # the last tag, so those bytes would match no tag at all.
              echo "::error::refusing to publish from a non-tag ref ($REF) -- pass publish_ref=refs/tags/vX.Y.Z"
              exit 1
              ;;
          esac

      # 两条触发并存后，「推 tag」和「建 Release」会对同一个版本各跑一次。
      # 已发布不是错误，只是无事可做 —— 跳过发布步骤并留一条 warning，
      # 既幂等，也不会把「发过了」伪装成绿。
      - name: Check whether this version is already on npm
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "state=already" >> "$GITHUB_OUTPUT"
            echo "::warning::$NAME@$VER is already on npm -- skipping the publish steps (nothing to do)"
          else
            echo "state=new" >> "$GITHUB_OUTPUT"
            echo "OK: $NAME@$VER is not on npm yet"
          fi

      - name: Release gate (tests, lint, security scan)
        if: steps.published.outputs.state == 'new'
        run: |
          npm test
          npm run lint
          npm run security

      # 不带 token、不带 --provenance：Trusted Publishing 会自动生成 provenance。
      - name: Publish to npm (OIDC, no token)
        if: steps.published.outputs.state == 'new'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry-run: 只演练，不上传"
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
